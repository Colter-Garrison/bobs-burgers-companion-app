[build]
  publish = "dist"
  command = "expo export"

# Expo Router's file-based routing matches paths exactly, so a lowercased
# URL (e.g. /endcredits, typed by hand or lowercased by some link
# handler) wouldn't match the camelCase route without these rewrites —
# a second lowercase app/ file isn't an option since this filesystem is
# case-insensitive and the two would collide.
# Must come before the catch-all below — Netlify uses the first match.
[[redirects]]
  from = "/endcredits"
  to = "/endCredits"
  status = 200

[[redirects]]
  from = "/pestcontrol"
  to = "/pestControl"
  status = 200

[[redirects]]
  from = "/aboutthedev"
  to = "/aboutTheDev"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200