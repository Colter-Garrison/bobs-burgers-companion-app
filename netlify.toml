[build]
  publish = "dist"
  command = "expo export"

# Expo Router's file-based routing matches paths exactly, so a lowercased
# URL (e.g. /endcredits, typed by hand or lowercased by some link handler)
# wouldn't match the camelCase route. These are real redirects (301), not
# rewrites: the browser has to land on the camelCase URL, or its router
# would render the not-found route onto that page's pre-built HTML and hit
# a hydration mismatch.
# Must come before the catch-all below — Netlify uses the first match.
[[redirects]]
  from = "/endcredits"
  to = "/endCredits"
  status = 301

[[redirects]]
  from = "/pestcontrol"
  to = "/pestControl"
  status = 301

[[redirects]]
  from = "/aboutthedev"
  to = "/aboutTheDev"
  status = 301

# Every detail URL (/detail/episodes/3, ...) is served the one pre-built
# detail page; the screen reads the real category/id in the browser. See
# the static-export note in app/detail/[category]/[id].tsx.
[[redirects]]
  from = "/detail/*"
  to = "/detail/[category]/[id].html"
  status = 200

# Anything else without its own pre-built page is a real 404. There's
# deliberately no single-page-app catch-all to /index.html: this is a
# static export, so serving Home's HTML for another URL makes the browser
# hydrate the wrong page (React error #418).
[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404