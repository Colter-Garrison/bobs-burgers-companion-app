name: CI

# Runs on every push to main/dev, and on every pull request (regardless
# of target branch) — a PR is how you'd normally get changes into main,
# so checking it before merge is the whole point of having CI. Pushing
# straight to a scratch/feature branch won't trigger this, only main,
# dev, and PRs — that keeps CI from running on every single commit of
# work-in-progress on a branch nobody's proposed merging yet.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # `npm install`, not `npm ci`, here specifically: `npm ci` demands
      # the lockfile be a *complete* cross-platform record and fails
      # outright if it isn't — and this project's lockfile has a known
      # gap in an optional native/WASM dependency branch (pulled in
      # transitively through ESLint's dependency chain) that only shows
      # up when resolving on Linux, never on macOS where the lockfile
      # was generated. `npm install` tolerates that gap instead of
      # hard-failing on it, while still installing from the lockfile's
      # pinned versions rather than re-resolving everything.
      - run: npm install

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci

      # e2e/drawer-auth.spec.ts and e2e/favorites-sync.spec.ts sign up
      # and log in for real — favorites and auth are real API resources,
      # not something the frontend can fake client-side (see their own
      # file comments) — so server/ has to actually be running before
      # test:e2e starts, the same as running it locally. playwright.
      # config.ts's webServer block only starts the static frontend
      # export on :4173; it doesn't know about the backend at all.
      - run: npm ci
        working-directory: server

      - run: npm run build
        working-directory: server

      - name: Start backend
        working-directory: server
        run: npm start > backend.log 2>&1 &
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend never became healthy" >&2
          cat server/backend.log >&2
          exit 1

      # Playwright's browser binaries aren't part of npm's dependency
      # tree — they're downloaded separately. A fresh CI machine has
      # none installed, so this step is required every run (no OS-level
      # browser to fall back on, unlike your own machine).
      - run: npx playwright install --with-deps chromium

      # test:e2e runs `expo export` + serves it + drives real Chromium
      # against it (see playwright.config.ts's webServer block) — GitHub
      # Actions sets CI=true automatically, which is what makes
      # playwright.config.ts's retries/forbidOnly logic switch on.
      - run: npm run test:e2e

      # If the E2E run fails, the HTML report (screenshots, traces) is
      # the main way to figure out why on a machine you can't log into —
      # upload it so it's downloadable from the failed run's summary
      # page instead of being lost the moment the runner shuts down.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log
          path: server/backend.log
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      # server/.env is gitignored (it holds a real DB password) and
      # doesn't exist on the runner, so the same two values have to come
      # from GitHub's own encrypted secrets store instead. These tests
      # hit the real dev Neon database, same as running them locally.
      - run: npm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
